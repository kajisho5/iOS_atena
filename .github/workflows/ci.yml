name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  core-linux:
    name: AtenaCore tests (Linux) and string catalog check
    runs-on: ubuntu-24.04
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test AtenaCore
        run: swift test --package-path Packages/AtenaCore
      - name: Check string catalog and project file list
        run: |
          apt-get update -qq && apt-get install -y -qq python3 > /dev/null
          python3 tools/check_strings.py
          python3 tools/check_project.py

  ios:
    name: Build and test (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: |
          xcodebuild -version
          sw_vers
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), reverse=True)
          for runtime in runtimes:
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone") and "Pro" not in d["name"] and d.get("isAvailable"):
                      print(d["udid"]); sys.exit(0)
          for runtime in runtimes:
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"
      - name: Build and test
        env:
          TEST_RUNNER_SNAPSHOT_DIR: ${{ github.workspace }}/snapshots
        run: |
          set +e
          xcodebuild test \
            -project AtenaPrint.xcodeproj \
            -scheme AtenaPrint \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO > xcodebuild.log 2>&1
          status=$?
          grep -E "error:|warning: .*(isolat|Sendable|concurrency)|Test (Suite|Case|run)|✔|✘|\*\* " xcodebuild.log | sort -u | head -400
          exit $status
      - name: Screen snapshots on iPad
        env:
          TEST_RUNNER_SNAPSHOT_DIR: ${{ github.workspace }}/snapshots
        run: |
          IPAD=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted((r for r in devices if "iOS" in r), reverse=True):
              for d in devices[runtime]:
                  if d["name"].startswith("iPad") and d.get("isAvailable"):
                      print(d["udid"]); sys.exit(0)
          ')
          xcrun simctl list devices | grep "$IPAD"
          set +e
          xcodebuild test-without-building \
            -project AtenaPrint.xcodeproj \
            -scheme AtenaPrint \
            -destination "id=$IPAD" \
            -derivedDataPath build/DerivedData \
            -only-testing:AtenaPrintTests/ScreenSnapshotTests \
            CODE_SIGNING_ALLOWED=NO > xcodebuild-ipad.log 2>&1
          status=$?
          grep -E "error:|Test (Suite|Case|run)|✔|✘|\*\* " xcodebuild-ipad.log | sort -u | head -100
          exit $status
      - name: Summarize errors
        if: failure()
        run: grep -E "error:" xcodebuild.log | sort -u | head -100 || true
      - name: Build for iPad (generic)
        run: |
          set -o pipefail
          xcodebuild build -project AtenaPrint.xcodeproj -scheme AtenaPrint \
            -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO | tail -5
      - name: Compare committed project with XcodeGen output
        if: always()
        run: |
          brew install xcodegen > /dev/null
          xcodegen generate
          git diff --stat -- AtenaPrint.xcodeproj AtenaPrint/Info.plist || true
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots
          if-no-files-found: ignore

  iphone-duo:
    # Apple's iPhone Duo guidance: build with the iOS 27.1 SDK and check on the iPhone Duo simulator.
    name: Screen snapshots (iPhone Duo simulator, Xcode 27.1)
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
          sw_vers
      - name: Find the iPhone Duo simulator
        id: sim
        run: |
          xcrun simctl help | grep -iE "fold|posture|display|hinge" || echo "no fold-related simctl command found"
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted((r for r in devices if "iOS" in r), reverse=True):
              for d in devices[runtime]:
                  if d["name"] == "iPhone Duo" and d.get("isAvailable"):
                      print(d["udid"]); sys.exit(0)
          sys.exit("iPhone Duo simulator not found")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"
      # Xcode 27.1 has no supported command to fold or unfold the simulator (only Device Hub's hinge control).
      # duoctl (MIT, https://github.com/skarol/duoctl) sends the same hinge event; it is used in CI only,
      # pinned to a reviewed commit, and never shipped in the app. Like duoctl's CI example, the hinge is
      # set right after a fresh boot, before xcodebuild runs.
      - name: Fetch duoctl and boot the simulator
        run: |
          git init -q "$RUNNER_TEMP/duoctl"
          git -C "$RUNNER_TEMP/duoctl" fetch -q --depth 1 https://github.com/skarol/duoctl efd5e3d62fd85f555057b429deafcc9c81123454
          git -C "$RUNNER_TEMP/duoctl" checkout -q FETCH_HEAD
          xcrun simctl boot "${{ steps.sim.outputs.udid }}"
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
          # duoctl reads the active display through devicectl. On a headless runner no display was active,
          # so open the simulator's host app (Device Hub / Simulator, whichever this Xcode ships) to attach one.
          ls "$(xcode-select -p)/Applications"
          for app in "$(xcode-select -p)/Applications/"*.app; do
            case "$app" in *Simulator*|*Device*) open -a "$app" --args -CurrentDeviceUDID "${{ steps.sim.outputs.udid }}" && echo "opened $app";; esac
          done
          for i in $(seq 1 30); do
            active=$(xcrun devicectl device info displays -d "${{ steps.sim.outputs.udid }}" --json-output - 2>/dev/null \
              | python3 -c 'import json,sys; d=json.load(sys.stdin)["result"]["displays"]; print(sum(1 for x in d if x.get("active")))' 2>/dev/null)
            echo "active displays: ${active:-?}"
            [ "${active:-0}" -gt 0 ] && break
            sleep 5
          done
          xcrun devicectl device info displays -d "${{ steps.sim.outputs.udid }}" 2>&1 | head -30
      - name: Build and capture (unfolded, inner display)
        env:
          DUOCTL_UDID: ${{ steps.sim.outputs.udid }}
          TEST_RUNNER_SNAPSHOT_DIR: ${{ github.workspace }}/snapshots-duo
          TEST_RUNNER_SNAPSHOT_PROFILE: duo
        run: |
          "$RUNNER_TEMP/duoctl/bin/duoctl" open
          "$RUNNER_TEMP/duoctl/bin/duoctl" state
          set +e
          xcodebuild test \
            -project AtenaPrint.xcodeproj \
            -scheme AtenaPrint \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -only-testing:AtenaPrintTests/ScreenSnapshotTests \
            CODE_SIGNING_ALLOWED=NO > xcodebuild-duo.log 2>&1
          status=$?
          grep -E "error:|warning: .*(deprecat|isolat|Sendable)|Test (Suite|Case|run)|✔|✘|\*\* " xcodebuild-duo.log | sort -u | head -200
          cat snapshots-duo/diagnostics-duo-*.txt 2>/dev/null
          exit $status
      - name: Capture (folded, outer display)
        env:
          DUOCTL_UDID: ${{ steps.sim.outputs.udid }}
          TEST_RUNNER_SNAPSHOT_DIR: ${{ github.workspace }}/snapshots-duo
          TEST_RUNNER_SNAPSHOT_PROFILE: duo
        run: |
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
          "$RUNNER_TEMP/duoctl/bin/duoctl" close || echo "duoctl close failed; the simulator may already be folded"
          set +e
          xcodebuild test-without-building \
            -project AtenaPrint.xcodeproj \
            -scheme AtenaPrint \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -only-testing:AtenaPrintTests/ScreenSnapshotTests \
            CODE_SIGNING_ALLOWED=NO > xcodebuild-duo-outer.log 2>&1
          status=$?
          grep -E "error:|Test (Suite|Case|run)|✔|✘|\*\* " xcodebuild-duo-outer.log | sort -u | head -100
          cat snapshots-duo/diagnostics-duo-*.txt 2>/dev/null
          ls snapshots-duo
          exit $status
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-duo
          path: snapshots-duo
          if-no-files-found: ignore
