<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1040" viewBox="0 0 1680 1040" font-family="-apple-system, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3C3C43"/>
    </marker>
    <marker id="arrPro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#AF52DE"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #1C1C1E; }
      .sub { font-size: 14px; fill: #6C6C70; }
      .lane { font-size: 15px; font-weight: 700; fill: #8E8E93; letter-spacing: 1px; }
      .card { fill: #FFFFFF; stroke: #C7C7CC; stroke-width: 1.5; }
      .sys { fill: #F2F2F7; stroke: #8E8E93; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .pro { fill: #F7EEFC; stroke: #AF52DE; stroke-width: 1.5; }
      .id { font-size: 12px; font-weight: 700; fill: #007AFF; }
      .name { font-size: 16px; font-weight: 700; fill: #1C1C1E; }
      .item { font-size: 12.5px; fill: #3C3C43; }
      .kind { font-size: 11px; fill: #8E8E93; }
      .edge { stroke: #3C3C43; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
      .edgePro { stroke: #AF52DE; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrPro); }
      .label { font-size: 11.5px; fill: #3C3C43; }
      .labelPro { font-size: 11.5px; fill: #AF52DE; font-weight: 600; }
      .tab { fill: #007AFF; }
      .tabtxt { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
      .legend { font-size: 12.5px; fill: #3C3C43; }
    </style>
  </defs>

  <rect width="1680" height="1040" fill="#FAFAFC"/>
  <text x="40" y="52" class="title">宛名印刷 はがき・封筒 — 画面遷移図 v0.1</text>
  <text x="40" y="76" class="sub">TabView 3タブ構成 / iPad・Mac は宛先タブを NavigationSplitView（iPhone では NavigationStack に自動で折りたたみ）</text>

  <!-- Root -->
  <rect x="40" y="100" width="1600" height="44" rx="10" fill="#E5E5EA"/>
  <text x="60" y="128" class="name">RootView（TabView）</text>
  <rect x="300" y="108" width="150" height="28" rx="14" class="tab"/><text x="375" y="127" text-anchor="middle" class="tabtxt">宛先 person.2</text>
  <rect x="900" y="108" width="170" height="28" rx="14" class="tab"/><text x="985" y="127" text-anchor="middle" class="tabtxt">レイアウト envelope</text>
  <rect x="1290" y="108" width="160" height="28" rx="14" class="tab"/><text x="1370" y="127" text-anchor="middle" class="tabtxt">設定 gearshape</text>

  <text x="40" y="178" class="lane">宛先タブ</text>
  <text x="900" y="178" class="lane">レイアウトタブ</text>
  <text x="1290" y="178" class="lane">設定タブ</text>

  <!-- S01 -->
  <rect x="40" y="190" width="230" height="190" rx="12" class="card"/>
  <text x="56" y="214" class="id">S01</text><text x="92" y="214" class="name">グループ一覧</text>
  <text x="56" y="232" class="kind">Split: サイドバー</text>
  <text x="56" y="258" class="item">・すべて</text>
  <text x="56" y="278" class="item">・未印刷</text>
  <text x="56" y="298" class="item">・年賀状2026 / 仕事関係 …</text>
  <text x="56" y="318" class="item">・グループ追加・名称変更</text>
  <text x="56" y="338" class="item">・並べ替え・削除（確認あり）</text>
  <text x="56" y="362" class="item">・一括印刷（グループ単位）</text>

  <!-- S02 -->
  <rect x="320" y="190" width="260" height="250" rx="12" class="card"/>
  <text x="336" y="214" class="id">S02</text><text x="372" y="214" class="name">宛先一覧</text>
  <text x="336" y="232" class="kind">Split: コンテンツ / List</text>
  <text x="336" y="258" class="item">・検索 .searchable</text>
  <text x="336" y="278" class="item">・行: 氏名 様 / 〒 / 住所1行目</text>
  <text x="336" y="298" class="item">・印刷済み（送信日時）バッジ</text>
  <text x="336" y="318" class="item">・はみ出し ⚠︎ / メモ（喪中等）表示</text>
  <text x="336" y="338" class="item">・スワイプ削除</text>
  <text x="336" y="358" class="item">・「選択」→ 複数選択して印刷</text>
  <text x="336" y="378" class="item">・＋メニュー:</text>
  <text x="350" y="398" class="item">手入力 / 連絡先から / CSVから</text>
  <text x="336" y="422" class="item">・無料版: 「n / 10件」表示</text>

  <!-- S03 -->
  <rect x="630" y="190" width="230" height="190" rx="12" class="card"/>
  <text x="646" y="214" class="id">S03</text><text x="682" y="214" class="name">宛先詳細</text>
  <text x="646" y="232" class="kind">Split: 詳細 / Push</text>
  <text x="646" y="258" class="item">・宛名面サムネイル</text>
  <text x="646" y="278" class="item">・連絡先情報・メモ</text>
  <text x="646" y="298" class="item">・所属グループ</text>
  <text x="646" y="318" class="item">・印刷履歴（日時・用紙）</text>
  <text x="646" y="338" class="item">・「編集」</text>
  <text x="646" y="362" class="item">・「この宛先を印刷」</text>

  <!-- S04 -->
  <rect x="630" y="420" width="230" height="170" rx="12" class="card"/>
  <text x="646" y="444" class="id">S04</text><text x="682" y="444" class="name">宛先編集</text>
  <text x="646" y="462" class="kind">Sheet / Form</text>
  <text x="646" y="488" class="item">・氏名・連名（＋追加）</text>
  <text x="646" y="508" class="item">・敬称 Picker＋自由入力</text>
  <text x="646" y="528" class="item">・〒（数字キーパッド）</text>
  <text x="646" y="548" class="item">・住所 / 建物名 / メモ</text>
  <text x="646" y="568" class="item">・グループ（複数選択）</text>

  <!-- S05 -->
  <rect x="40" y="480" width="230" height="130" rx="12" class="sys"/>
  <text x="56" y="504" class="id">S05</text><text x="92" y="504" class="name">連絡先から取り込み</text>
  <text x="56" y="522" class="kind">System: CNContactPicker</text>
  <text x="56" y="548" class="item">・複数選択</text>
  <text x="56" y="568" class="item">・取り込み確認（件数・上限）</text>
  <text x="56" y="588" class="item">・上限超過時は残数を明示</text>

  <!-- S06 -->
  <rect x="320" y="500" width="260" height="190" rx="12" class="card"/>
  <text x="336" y="524" class="id">S06</text><text x="372" y="524" class="name">CSV取り込み</text>
  <text x="336" y="542" class="kind">Sheet / 3段階 NavigationStack</text>
  <text x="336" y="568" class="item">① ファイル選択 .fileImporter</text>
  <text x="336" y="588" class="item">② 列マッピング確認</text>
  <text x="350" y="606" class="item">先頭5行・文字コード切替</text>
  <text x="350" y="624" class="item">重複候補・取り込み先グループ</text>
  <text x="336" y="644" class="item">③ 結果（成功 / スキップ / エラー行）</text>
  <text x="336" y="670" class="labelPro">Pro 機能</text>

  <!-- S07 -->
  <rect x="320" y="750" width="320" height="230" rx="12" class="card"/>
  <text x="336" y="774" class="id">S07</text><text x="372" y="774" class="name">印刷プレビュー</text>
  <text x="336" y="792" class="kind">fullScreenCover</text>
  <text x="336" y="818" class="item">・実寸比プレビュー（用紙枠・〒枠＝表示のみ）</text>
  <text x="336" y="838" class="item">・一括時: ページ送り（n / N）</text>
  <text x="336" y="858" class="item">・はみ出し警告 / 二重印刷警告</text>
  <text x="336" y="878" class="item">・一括時:「未印刷のみ」/「全件」</text>
  <text x="336" y="898" class="item">・ピンチズーム、VoiceOver 読み上げ</text>
  <text x="336" y="922" class="item">・［印刷］常に無料</text>
  <text x="336" y="942" class="item">・［PDF］<tspan class="labelPro">Pro 機能</tspan> → ShareLink</text>
  <text x="336" y="964" class="kind">完了: PrintRecord 作成・成功回数+1 → レビュー依頼判定</text>

  <!-- S08 -->
  <rect x="700" y="790" width="230" height="110" rx="12" class="sys"/>
  <text x="716" y="814" class="id">S08</text><text x="752" y="814" class="name">AirPrint</text>
  <text x="716" y="832" class="kind">System: UIPrintInteractionController</text>
  <text x="716" y="858" class="item">・プリンタ・部数</text>
  <text x="716" y="878" class="item">・iPad/Mac はポップオーバー</text>

  <!-- Share sheet -->
  <rect x="700" y="930" width="230" height="70" rx="12" class="sys"/>
  <text x="716" y="954" class="name">共有シート</text>
  <text x="716" y="974" class="kind">System: PDF 保存・共有</text>
  <text x="716" y="990" class="kind">CSVテンプレート書き出しでも使用</text>

  <!-- S09 -->
  <rect x="900" y="190" width="340" height="290" rx="12" class="card"/>
  <text x="916" y="214" class="id">S09</text><text x="952" y="214" class="name">レイアウト</text>
  <text x="916" y="232" class="kind">iPhone: 上プレビュー＋下Form / iPad: 左右分割</text>
  <rect x="916" y="246" width="96" height="142" rx="2" fill="#FFFFFF" stroke="#1C1C1E" stroke-width="1"/>
  <g fill="none" stroke="#FF3B30" stroke-width="0.8">
    <rect x="958" y="257" width="6" height="8"/><rect x="966" y="257" width="6" height="8"/><rect x="974" y="257" width="6" height="8"/>
    <rect x="984" y="257" width="5" height="8"/><rect x="991" y="257" width="5" height="8"/><rect x="998" y="257" width="5" height="8"/><rect x="1005" y="257" width="5" height="8"/>
  </g>
  <g fill="#1C1C1E">
    <rect x="990" y="280" width="3" height="70"/><rect x="980" y="290" width="3" height="50"/>
    <rect x="958" y="285" width="6" height="90"/>
    <rect x="928" y="330" width="2" height="48"/><rect x="934" y="330" width="2" height="40"/>
  </g>
  <text x="1028" y="262" class="item">・用紙（はがき / 長3 / 長4 / 洋2 / 角2）</text>
  <text x="1028" y="282" class="item">・縦書き / 横書き</text>
  <text x="1028" y="302" class="item">・フォント（明朝 / 角ゴ / 丸ゴ）</text>
  <text x="1028" y="322" class="item">・漢数字変換（縦書き時）</text>
  <text x="1028" y="342" class="item">・差出人を印刷 ON/OFF</text>
  <text x="1028" y="362" class="item">・差出人の選択</text>
  <text x="1028" y="382" class="item">・サンプル宛先切替</text>
  <text x="916" y="414" class="item">・ライブプレビューは S07 と同じ AddressRenderer</text>
  <text x="916" y="434" class="item">・はみ出し時は警告表示</text>
  <text x="916" y="458" class="kind">設定は @AppStorage（JSON）に保存</text>

  <!-- S10 -->
  <rect x="1290" y="190" width="350" height="290" rx="12" class="card"/>
  <text x="1306" y="214" class="id">S10</text><text x="1342" y="214" class="name">設定</text>
  <text x="1306" y="232" class="kind">Form（insetGrouped）</text>
  <text x="1306" y="258" class="item">［差出人］差出人プロフィール →</text>
  <text x="1306" y="278" class="item">［印刷］印刷位置の調整 →</text>
  <text x="1306" y="298" class="item">［Pro］Pro（買い切り） →</text>
  <text x="1306" y="318" class="item">　　　　購入の復元</text>
  <text x="1306" y="338" class="item">［データ］CSVテンプレートを書き出す</text>
  <text x="1306" y="358" class="item">　　　　　印刷記録をリセット（確認あり）</text>
  <text x="1306" y="378" class="item">［このアプリについて］</text>
  <text x="1306" y="398" class="item">　プライバシーポリシー / 利用規約（Link）</text>
  <text x="1306" y="418" class="item">　バージョン</text>
  <text x="1306" y="452" class="kind">広告なし・データは端末内のみ の説明文を表示</text>

  <!-- S11 -->
  <rect x="1290" y="530" width="165" height="130" rx="12" class="card"/>
  <text x="1306" y="554" class="id">S11</text><text x="1342" y="554" class="name">差出人</text>
  <text x="1306" y="572" class="kind">Push → Sheet 編集</text>
  <text x="1306" y="598" class="item">・自宅用 / 仕事用 …</text>
  <text x="1306" y="618" class="item">・追加・並べ替え</text>
  <text x="1306" y="638" class="item">・氏名・〒・住所</text>

  <!-- S12 -->
  <rect x="1475" y="530" width="165" height="130" rx="12" class="card"/>
  <text x="1491" y="554" class="id">S12</text><text x="1527" y="554" class="name">位置調整</text>
  <text x="1491" y="572" class="kind">Push / Form</text>
  <text x="1491" y="598" class="item">・用紙ごとに保存</text>
  <text x="1491" y="618" class="item">・上下左右 ±mm</text>
  <text x="1491" y="638" class="item">・テスト印刷</text>

  <!-- S13 Paywall -->
  <rect x="1060" y="700" width="380" height="250" rx="12" class="pro"/>
  <text x="1076" y="724" class="id" fill="#AF52DE">S13</text><text x="1112" y="724" class="name">Pro（買い切り）</text>
  <text x="1076" y="742" class="kind">Sheet — ユーザー操作時のみ表示</text>
  <text x="1076" y="768" class="item">・宛先無制限 / CSV取り込み / PDF出力</text>
  <text x="1076" y="788" class="item">・「これは買い切りです。毎月・毎週の支払いは</text>
  <text x="1076" y="806" class="item">　発生しません」</text>
  <text x="1076" y="826" class="item">・「広告は今後も入れません」</text>
  <text x="1076" y="846" class="item">・印刷は無料版でも無制限・透かしなし</text>
  <rect x="1076" y="862" width="348" height="44" rx="12" fill="#007AFF"/>
  <text x="1250" y="890" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">¥800で購入（displayPrice）</text>
  <text x="1250" y="932" text-anchor="middle" font-size="14" fill="#007AFF">購入の復元</text>

  <!-- Edges: main -->
  <path class="edge" d="M270,285 L318,285"/>
  <path class="edge" d="M580,285 L628,285"/>
  <text x="588" y="276" class="label">行タップ</text>
  <path class="edge" d="M745,380 L745,418"/>
  <text x="752" y="404" class="label">編集</text>
  <path class="edge" d="M580,420 C610,420 610,470 628,480"/>
  <text x="592" y="465" class="label">手入力</text>
  <path class="edge" d="M330,440 C300,460 290,500 272,520"/>
  <text x="252" y="458" class="label">連絡先から</text>
  <path class="edge" d="M450,440 L450,498"/>
  <text x="458" y="476" class="label">CSVから（購入済）</text>

  <!-- to preview -->
  <path class="edge" d="M50,380 L28,402 L28,860 Q28,880 48,880 L318,880"/>
  <text x="60" y="872" class="label">一括印刷（S01）</text>
  <path class="edge" d="M322,432 C295,460 295,720 340,748"/>
  <path class="edge" d="M860,330 C885,330 885,700 642,790"/>
  <text x="690" y="772" class="label">この宛先を印刷</text>
  <text x="230" y="732" class="label">選択して印刷</text>
  <path class="edge" d="M640,845 L698,845"/>
  <text x="648" y="836" class="label">印刷</text>
  <path class="edge" d="M640,960 L698,965"/>
  <text x="648" y="952" class="label">PDF</text>

  <!-- settings -->
  <path class="edge" d="M1372,480 L1372,528"/>
  <path class="edge" d="M1557,480 L1557,528"/>

  <!-- Paywall edges -->
  <path class="edgePro" d="M450,690 C520,720 900,720 1058,780"/>
  <text x="760" y="712" class="labelPro">CSVから（未購入）</text>
  <path class="edgePro" d="M640,915 L1058,915"/>
  <text x="950" y="910" class="labelPro">PDF（未購入）</text>
  <path class="edgePro" d="M860,560 C960,600 1000,680 1058,740"/>
  <text x="890" y="590" class="labelPro">11件目を保存（無料版）</text>
  <path class="edgePro" d="M1292,470 C1265,520 1265,640 1270,698"/>
  <text x="1170" y="520" class="labelPro">Pro（買い切り）行</text>

  <!-- Legend -->
  <rect x="40" y="1000" width="1600" height="1" fill="#E5E5EA"/>
  <rect x="1060" y="975" width="22" height="14" rx="3" class="card"/><text x="1088" y="987" class="legend">アプリ画面</text>
  <rect x="1170" y="975" width="22" height="14" rx="3" class="sys"/><text x="1198" y="987" class="legend">システムUI</text>
  <rect x="1290" y="975" width="22" height="14" rx="3" class="pro"/><text x="1318" y="987" class="legend">課金</text>
  <path class="edgePro" d="M1370,982 L1410,982"/><text x="1418" y="987" class="legend">Paywall へ（能動操作のみ）</text>
  <text x="40" y="1024" class="sub">印刷フロー（S07→S08）の途中で Paywall が自動表示される経路は存在しない。「印刷」ボタンは無料版でも常に動作する。</text>
</svg>
